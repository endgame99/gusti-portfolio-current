  <title>Clean Work Detail Reference</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      font-family: "Acumin Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #111111;
    }

    .work-detail {
      width: 100%;
    }

    .work-detail__content {
      width: min(100%, 1300px);
      margin-inline: auto;
    }

    .work-detail__video,
    .work-detail__item {
      margin: 0;
      width: 100%;
    }

    .work-detail__video video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #000000;
    }

    .work-detail__gallery {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .work-detail__item img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
